---
# "Bring Your Own Cluster". When true, Hive ClusterDeployment may carry a stale infraID from a failed
# provision attempt; the submariner SG tag job uses the managed cluster Infrastructure CR instead.
byoc: false

# Namespace for ODF SSL / CA post-install Jobs and RBAC (not cluster-proxy-ca-bundle).
clusterCaMgt:
  # -- Namespace for ODF CA prerequisites and Ramen trusted-CA workloads.
  namespace: cluster-ca-mgt
  # -- Create clusterCaMgt.namespace when installing the chart.
  createNamespace: false

global:
  clusterDomain: cluster.example.com
  # Pattern name. Application CR namespace for PostSync Jobs is
  # global.pattern-clusterGroup.name (NOT global.namespace).
  # Argo $ARGOCD_APP_NAMESPACE / global.namespace is the destination namespace
  # (e.g. regional-dr), not where the Application CR lives.
  pattern: ramendr-starter-kit-hub
  # Set by Argo CD to $ARGOCD_APP_NAMESPACE → destination namespace only.
  # namespace: ""
  # Parent hub Application namespace (validated patterns app-of-apps).
  vpArgoNamespace: vp-gitops
  # AWS: Hive AWS creds ExternalSecret, ClusterDeployment platform.aws, Submariner gateway/credentials. Use non-AWS (e.g. BareMetal) to skip those.
  clusterPlatform: AWS

# Hub DRCluster CRs. Use when MirrorPeer/ODF is not creating them (e.g. partner CSI).
# Also rendered when ramen.infrastructureEnabled is true.
drCluster:
  # -- When true, render hub DRCluster CRs. When false, expect external automation
  # (e.g. ODF MirrorPeer) unless ramen.infrastructureEnabled is true.
  create: false
  # -- S3 profile name for the primary DRCluster. Empty defaults to `s3profile-` plus the primary cluster name.
  # Must match a profile in hub Ramen config (ramen-hub-operator-config).
  primaryS3ProfileName: ""
  # -- S3 profile name for the secondary DRCluster. Empty defaults to `s3profile-` plus the secondary cluster name.
  secondaryS3ProfileName: ""
  # Upsert hub Ramen s3StoreProfiles when chart-owned DRClusters are created
  # (same gate as drCluster.create / partner infrastructureEnabled). Defaults target hub vp-s4-storage.
  # Does not set caCertificates — opp-policy s3CaInjector owns that.
  s3StoreProfiles:
    ramen:
      # -- Namespace of the hub Ramen operator ConfigMap.
      namespace: openshift-operators
      # -- Hub Ramen ConfigMap name.
      configMapName: ramen-hub-operator-config
      # -- Key holding RamenConfig YAML.
      configKey: ramen_manager_config.yaml
    # -- S3 endpoint URL. Empty discovers from endpointSource Route.
    s3CompatibleEndpoint: ""
    # -- S3 region (required by Ramen AWS SDK).
    s3Region: us-east-1
    # -- When true, create missing buckets named for each profile.
    ensureBuckets: true
    s3SecretRef:
      # -- Secret Ramen profiles reference (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY).
      name: ramen-s3-credentials
      # -- Namespace for s3SecretRef (copied from credentialsSource when different).
      namespace: openshift-operators
    # Hub S4 defaults (override for non-S4 object stores).
    credentialsSource:
      # -- Source Secret with AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY.
      name: s4-credentials
      # -- Namespace of credentialsSource.
      namespace: vp-s4-storage
    endpointSource:
      # -- Route name for S3 API. Empty picks first Route with targetPort s3-api in routeNamespace.
      routeName: ""
      # -- Namespace to discover the S3 Route from.
      routeNamespace: vp-s4-storage
    primary:
      # -- Bucket for the primary profile. Empty defaults to the primary profile name.
      s3Bucket: ""
    secondary:
      # -- Bucket for the secondary profile. Empty defaults to the secondary profile name.
      s3Bucket: ""
    job:
      # -- Argo CD Sync-hook wave (before DRClusters at 7 / DRPolicy validation at 8).
      argoCDSyncWave: "6"
      # -- Seconds to wait for Ramen ConfigMap and credentials.
      waitSeconds: 3600
      # -- Poll interval while waiting.
      pollInterval: 15
      # -- Job backoffLimit.
      backoffLimit: 10
      # -- Job activeDeadlineSeconds.
      activeDeadlineSeconds: 7200

# Main cluster group name used by some chart defaults. Application CR namespace
# for PostSync Jobs is global.pattern-clusterGroup.name (hub BOM), not this
# spoke-oriented default and not global.namespace / $ARGOCD_APP_NAMESPACE.
main:
  clusterGroupName: resilient

# Ramen hub resources.
# resourcesEnabled: full set (DRPolicy, DRPC, Placement, health/validation jobs).
# infrastructureEnabled: DRPolicy, DRCluster validation, and chart-owned DRClusters only
# (useful when resourcesEnabled is false, e.g. partner CSI without DRPC/VMs).
ramen:
  updateRamenConfig: true
  # -- When false, skip DRPC, Placement, and DRPC health job. DRPolicy/validation/DRClusters
  # still render if infrastructureEnabled is true.
  resourcesEnabled: true
  # -- When true (or when resourcesEnabled is true), render DRPolicy, DRCluster validation,
  # and chart-owned DRClusters (see also drCluster.create).
  infrastructureEnabled: false

# Edge GitOps VMs deployment (script and helm chart)
edgeGitopsVms:
  # -- When false, skip the edge-gitops-vms deploy Job and its RBAC/ConfigMap.
  enabled: true
  chartVersion: "0.5.2"

# Argo CD Application control after chart settlement.
argocd:
  # -- When true, PostSync Job (wave 13) removes regional-dr Application automated
  # sync and adds hub ignoreDifferences so parent selfHeal cannot re-enable it.
  # Set false to leave autosync on after install.
  disableAutomatedSync: true

# Optional: install boutique from charts.validatedpatterns.io on the same cluster as edge-gitops-vms (PostSync job).
boutique:
  deploy: false
  namespace: boutique
  chartVersion: "0.0.9"
  chartName: boutique
  helmRepoUrl: https://charts.validatedpatterns.io
  helmRepoAlias: validatedpatterns

redis:
  external:
    enabled: false
    address: rhel9-redis-001.gitops-vms.svc.cluster.local

secretStore:
  name: vault-backend
  kind: ClusterSecretStore

clusterDeployments:
  awsSecretKey: secret/hub/aws
  pullSecretKey: secret/hub/openshiftPullSecret
  secretRefreshInterval: 90s

submariner:
  instanceType: m5.xlarge
  ipsecNatPort: 4500
  NATTEnable: true
  cableDriver: vxlan
  # EC2 security group tagging job (AWS only; requires global.clusterPlatform AWS).
  sgTagJobEnabled: false

# Minimal overrides for cluster names, versions, regions (e.g. overrides/values-cluster-names.yaml).
# Merge override file FIRST so full regionalDR stays here and only clusterOverrides are applied.
# clusterOverrides:
#   primary:
#     name: ocp-primary
#     version: 4.18.7
#     install_config:
#       metadata:
#         name: ocp-primary
#       platform:
#         aws:
#           region: us-west-1
#   secondary:
#     name: ocp-secondary
#     ...

# DRPlacementControl (gitops-vm-protection) - override in values-cluster-names or values
drpc:
  name: gitops-vm-protection
  namespace: openshift-dr-ops
  drPolicyRef:
    name: 2m-vm
  kubeObjectProtection:
    captureInterval: 2m0s
    kubeObjectSelector: {}
  placementRef:
    name: gitops-vm-protection-placement-1
    namespace: openshift-dr-ops
  protectedNamespaces:
    - gitops-vms
  pvcSelector: {}
  preferredCluster: ocp-primary # default; override in values-cluster-names or values
  # -- Block PVC storage class for KubeVirt VMs. drcluster-validation (sync-wave 8) blocks DRPC until
  # DRPolicy status is Validated=True and status.async.peerClasses include replicationID.
  vmStorageClassName: ocs-storagecluster-ceph-rbd-virtualization
  # PostSync Job drpc-health-check (resourcesEnabled only). Argo CD sync disable is a
  # separate PostSync Job (argocd-sync-disable, wave 13) when argocd.disableAutomatedSync
  # is true (default). Sync-disable looks up the Application CR in pattern-clusterGroup.name
  # (not destination global.namespace) and patches the hub Application (global.vpArgoNamespace)
  # with ignoreDifferences on Application/regional-dr /spec/syncPolicy/automated so parent
  # selfHeal cannot re-enable it.
  healthCheck:
    maxAttempts: 30
    retryDelaySeconds: 30
    deleteWaitRetries: 24
    deleteWaitDelay: 5

ansible:
  containerImage: quay.io/validatedpatterns/utility-container:latest
  # Ansible-playbook verbosity (0-4). Jobs using rdr.ansibleBootstrap export ANSIBLE_VERBOSITY when > 0.
  verbosity: 0
  # Argo CD resource sync-options for regionaldr-ansible. ServerSideApply converges large CM data;
  # add Replace=true only if your Argo CD server allows sync replace (often disabled on Argo CD v3).
  configMapArgoSyncOptions: Prune=false,ServerSideApply=true

# Legacy keys retained for values compatibility; CA injection lives in opp-policy / vp-proxy.
odfRamenTrustedCa:
  ramenS3WaitSeconds: 3600
  trustedCaWaitSeconds: 3600
  pollInterval: 15

regionalDR:
  - name: resilient # Matches with ClusterSet
    globalnetEnabled: false # Support for overlapping CIDR
    clusters: # Pair of clusters, make sure to create each in a different region
      primary:
        name: ocp-primary
        clusterGroup: resilient
        version: 4.18.7
        install_config:
          apiVersion: v1
          baseDomain: '{{ join "." (slice (splitList "." $.Values.global.clusterDomain) 1) }}'
          metadata:
            name: ocp-primary
          controlPlane:
            name: master
            replicas: 3
            platform:
              aws:
                type: m5.4xlarge
          compute:
            - name: worker
              replicas: 3
              platform:
                aws:
                  type: m5.metal
          networking:
            clusterNetwork:
              - cidr: 10.132.0.0/14
                hostPrefix: 23
            machineNetwork:
              - cidr: 10.1.0.0/16
            networkType: OVNKubernetes
            serviceNetwork:
              - 172.20.0.0/16
          platform:
            aws:
              region: us-west-1
              userTags:
                project: ValidatedPatterns
          publish: External
          sshKey: ""
          pullSecret: ""
      secondary:
        name: ocp-secondary
        clusterGroup: resilient
        version: 4.18.7
        install_config:
          apiVersion: v1
          baseDomain: '{{ join "." (slice (splitList "." $.Values.global.clusterDomain) 1) }}'
          metadata:
            name: ocp-secondary
          controlPlane:
            name: master
            replicas: 3
            platform:
              aws:
                type: m5.4xlarge
          compute:
            - name: worker
              replicas: 3
              platform:
                aws:
                  type: m5.metal
          networking:
            clusterNetwork:
              - cidr: 10.136.0.0/14
                hostPrefix: 23
            machineNetwork:
              - cidr: 10.2.0.0/16
            networkType: OVNKubernetes
            serviceNetwork:
              - 172.21.0.0/16
          platform:
            aws:
              region: us-east-1
              userTags:
                project: ValidatedPatterns
          publish: External
          sshKey: ""
          pullSecret: ""
    # List of sync policy intervals: RPO should be larger than the sync time.
    # If your sync process takes 3 mins, the interval should be at least 4-5 mins.
    drpolicies:
      - interval: 2m
        vmSupport: true
      - interval: 2m

# helm-unittest only (templates/helm-unittest/). Stays off for normal installs.
helmUnittest:
  rdrMerge:
    enabled: false
    mergeInstallConfig:
      base: {}
      over: {}
  s3Profiles:
    # -- Enable rdr-s3-profiles-fixture for helper unit tests.
    enabled: false
