{{- if eq "1" (include "rdr.s3StoreProfilesCreate" . | trim) }}
{{- $ssp := ((.Values.drCluster | default dict).s3StoreProfiles | default dict) -}}
{{- $ramen := ($ssp.ramen | default dict) -}}
{{- $secretRef := ($ssp.s3SecretRef | default dict) -}}
{{- $credSrc := ($ssp.credentialsSource | default dict) -}}
{{- $epSrc := ($ssp.endpointSource | default dict) -}}
{{- $job := ($ssp.job | default dict) -}}
{{- $primary := ($ssp.primary | default dict) -}}
{{- $secondary := ($ssp.secondary | default dict) -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: ramen-s3-profiles
  namespace: open-cluster-management
  labels:
    app.kubernetes.io/name: ramen-s3-profiles
    app.kubernetes.io/component: s3-store-profiles
  annotations:
    # Sync (not PostSync): must complete before DRClusters (wave 7) and DRPolicy
    # validation (wave 8), which require s3StoreProfiles in RamenConfig.
    argocd.argoproj.io/sync-wave: {{ ($job.argoCDSyncWave | default "6") | quote }}
    argocd.argoproj.io/sync-options: Prune=false
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    checksum/script: {{ printf "%s%s" (.Files.Get "files/upsert-ramen-s3-profiles.sh") (.Files.Get "files/restart-ramen-hub-operator.sh") | sha256sum }}
spec:
  backoffLimit: {{ $job.backoffLimit | default 10 }}
  activeDeadlineSeconds: {{ $job.activeDeadlineSeconds | default 7200 }}
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ramen-s3-profiles
        app.kubernetes.io/component: s3-store-profiles
    spec:
      restartPolicy: OnFailure
      serviceAccountName: ramen-s3-profiles
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: upsert
        image: {{ $.Values.ansible.containerImage }}
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        env:
        - name: RAMEN_NAMESPACE
          value: {{ ($ramen.namespace | default "openshift-operators") | quote }}
        - name: RAMEN_CONFIGMAP
          value: {{ ($ramen.configMapName | default "ramen-hub-operator-config") | quote }}
        - name: RAMEN_CONFIG_KEY
          value: {{ ($ramen.configKey | default "ramen_manager_config.yaml") | quote }}
        - name: PRIMARY_PROFILE_NAME
          value: {{ include "rdr.drClusterPrimaryS3ProfileName" . | quote }}
        - name: SECONDARY_PROFILE_NAME
          value: {{ include "rdr.drClusterSecondaryS3ProfileName" . | quote }}
        - name: PRIMARY_BUCKET
          value: {{ ($primary.s3Bucket | default "") | quote }}
        - name: SECONDARY_BUCKET
          value: {{ ($secondary.s3Bucket | default "") | quote }}
        - name: S3_ENDPOINT
          value: {{ ($ssp.s3CompatibleEndpoint | default "") | quote }}
        - name: S3_REGION
          value: {{ ($ssp.s3Region | default "us-east-1") | quote }}
        - name: ENSURE_BUCKETS
          value: {{ if hasKey $ssp "ensureBuckets" }}{{ ternary "true" "false" (index $ssp "ensureBuckets") | quote }}{{ else }}"true"{{ end }}
        - name: S3_SECRET_NAME
          value: {{ ($secretRef.name | default "ramen-s3-credentials") | quote }}
        - name: S3_SECRET_NAMESPACE
          value: {{ ($secretRef.namespace | default "openshift-operators") | quote }}
        - name: CREDENTIALS_SOURCE_NAME
          value: {{ ($credSrc.name | default "s4-credentials") | quote }}
        - name: CREDENTIALS_SOURCE_NAMESPACE
          value: {{ ($credSrc.namespace | default "vp-s4-storage") | quote }}
        - name: ENDPOINT_ROUTE_NAME
          value: {{ ($epSrc.routeName | default "") | quote }}
        - name: ENDPOINT_ROUTE_NAMESPACE
          value: {{ ($epSrc.routeNamespace | default "vp-s4-storage") | quote }}
        - name: WAIT_SECONDS
          value: {{ ($job.waitSeconds | default 3600) | quote }}
        - name: POLL_INTERVAL
          value: {{ ($job.pollInterval | default 15) | quote }}
        command:
        - /bin/bash
        - /scripts/upsert-ramen-s3-profiles.sh
        volumeMounts:
        - name: scripts
          mountPath: /scripts
          readOnly: true
      volumes:
      - name: scripts
        configMap:
          name: ramen-s3-profiles-script
          defaultMode: 0755
{{- end }}
