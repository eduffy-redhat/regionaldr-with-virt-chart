{{- if eq "1" (include "rdr.s3StoreProfilesCreate" . | trim) }}
{{- $ssp := ((.Values.drCluster | default dict).s3StoreProfiles | default dict) -}}
{{- $job := ($ssp.job | default dict) -}}
{{- $wave := ($job.argoCDSyncWave | default "6") | quote -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ramen-s3-profiles
  namespace: open-cluster-management
  labels:
    app.kubernetes.io/name: ramen-s3-profiles
    app.kubernetes.io/component: s3-store-profiles
  annotations:
    argocd.argoproj.io/sync-wave: {{ $wave }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ramen-s3-profiles
  labels:
    app.kubernetes.io/name: ramen-s3-profiles
    app.kubernetes.io/component: s3-store-profiles
  annotations:
    argocd.argoproj.io/sync-wave: {{ $wave }}
rules:
# Hub Ramen ConfigMap upsert
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch", "update", "patch"]
# Copy credentials Secret into Ramen namespace
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
# Discover S4 (or other) S3 Route host
- apiGroups: ["route.openshift.io"]
  resources: ["routes"]
  verbs: ["get", "list", "watch"]
---
# Bounce ramen-hub-operator pods after a real ConfigMap change. OLM reverts
# Deployment rollout-restart; delete the pods instead.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ramen-s3-profiles-hub-operator
  namespace: {{ include "rdr.ramenOperatorNamespace" . }}
  labels:
    app.kubernetes.io/name: ramen-s3-profiles
    app.kubernetes.io/component: s3-store-profiles
  annotations:
    argocd.argoproj.io/sync-wave: {{ $wave }}
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ramen-s3-profiles-hub-operator
  namespace: {{ include "rdr.ramenOperatorNamespace" . }}
  labels:
    app.kubernetes.io/name: ramen-s3-profiles
    app.kubernetes.io/component: s3-store-profiles
  annotations:
    argocd.argoproj.io/sync-wave: {{ $wave }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ramen-s3-profiles-hub-operator
subjects:
- kind: ServiceAccount
  name: ramen-s3-profiles
  namespace: open-cluster-management
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ramen-s3-profiles
  labels:
    app.kubernetes.io/name: ramen-s3-profiles
    app.kubernetes.io/component: s3-store-profiles
  annotations:
    argocd.argoproj.io/sync-wave: {{ $wave }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ramen-s3-profiles
subjects:
- kind: ServiceAccount
  name: ramen-s3-profiles
  namespace: open-cluster-management
{{- end }}
